services:
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      EVIDENCE_DB_PATH: /app/data/evidence_ledger.db
    ports:
      - "8000:8000"
    volumes:
      - evidence_data:/app/data

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"

volumes:
  evidence_data:
