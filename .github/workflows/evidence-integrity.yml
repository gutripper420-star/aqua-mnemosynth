name: Evidence Integrity Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt -r frontend/requirements.txt -r requirements-science.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Build container
        run: docker build -t aqua-mnemosynth-evidence .
