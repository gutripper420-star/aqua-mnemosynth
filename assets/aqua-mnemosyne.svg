<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Aqua Mnemosyne: memory held in a protective current</title>
  <desc id="description">An original illustration of a luminous blue water orb containing a connected archive of records, surrounded by a protective teal shield and flowing waves.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071629"/>
      <stop offset="0.55" stop-color="#102c48"/>
      <stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="28%" r="75%">
      <stop offset="0" stop-color="#c5fbff" stop-opacity=".96"/>
      <stop offset=".18" stop-color="#5adbea" stop-opacity=".86"/>
      <stop offset=".58" stop-color="#197cae" stop-opacity=".91"/>
      <stop offset="1" stop-color="#123456" stop-opacity=".98"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#92fff1" stop-opacity=".7"/>
      <stop offset="1" stop-color="#42b9c9" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56e4d1" stop-opacity="0"/>
      <stop offset=".48" stop-color="#56e4d1" stop-opacity=".68"/>
      <stop offset="1" stop-color="#68bdff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="34" fill="url(#background)"/>

  <g fill="#c6f7ff" opacity=".62">
    <circle cx="92" cy="104" r="2"/><circle cx="226" cy="176" r="1.5"/>
    <circle cx="1007" cy="124" r="2"/><circle cx="1080" cy="234" r="1.5"/>
    <circle cx="902" cy="78" r="1.5"/><circle cx="162" cy="346" r="1.5"/>
    <circle cx="1028" cy="428" r="2"/><circle cx="288" cy="89" r="1"/>
    <circle cx="851" cy="582" r="1.5"/><circle cx="122" cy="537" r="1.5"/>
  </g>

  <g fill="none" stroke="url(#wave)" stroke-width="2">
    <path d="M70 476 C220 413 321 543 481 480 S760 425 905 479 1060 516 1160 453"/>
    <path d="M45 503 C206 444 323 570 482 510 S759 458 907 510 1067 545 1185 483"/>
    <path d="M83 530 C225 478 334 597 489 539 S757 489 904 541 1053 578 1146 516"/>
  </g>

  <path d="M600 99 C738 151 819 161 886 164 L873 368 C865 485 756 563 600 624 C444 563 335 485 327 368 L314 164 C381 161 462 151 600 99Z"
        fill="url(#shield)" stroke="#82f7e6" stroke-opacity=".77" stroke-width="2.5"/>
  <path d="M600 123 C722 168 791 176 856 179 L845 363 C838 464 741 532 600 588 C459 532 362 464 355 363 L344 179 C409 176 478 168 600 123Z"
        fill="none" stroke="#a9fff1" stroke-opacity=".3" stroke-width="1.5"/>

  <circle cx="600" cy="337" r="169" fill="#40cfe1" opacity=".12" filter="url(#glow)"/>
  <circle cx="600" cy="337" r="146" fill="url(#orb)" stroke="#bafcff" stroke-opacity=".86" stroke-width="2"/>
  <ellipse cx="551" cy="278" rx="84" ry="38" fill="#e1ffff" opacity=".17" transform="rotate(-28 551 278)"/>

  <g fill="none" stroke="#d7ffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M517 320 L577 283 L650 307 L684 370 L622 408 L550 386 L517 320Z"/>
    <path d="M577 283 L580 350 L622 408 M517 320 L580 350 L650 307 M550 386 L580 350 L684 370"/>
    <path d="M549 249 C576 226 619 226 646 249 M539 431 C573 451 626 451 660 431"/>
  </g>
  <g fill="#f3ffff" stroke="#72e8ef" stroke-width="3">
    <circle cx="517" cy="320" r="8"/><circle cx="577" cy="283" r="8"/>
    <circle cx="650" cy="307" r="8"/><circle cx="684" cy="370" r="8"/>
    <circle cx="622" cy="408" r="8"/><circle cx="550" cy="386" r="8"/>
    <circle cx="580" cy="350" r="10"/>
  </g>

  <g fill="none" stroke="#b7fff2" stroke-width="3" stroke-linecap="round" opacity=".85">
    <path d="M455 341 C483 318 506 318 530 341 C554 364 577 364 600 341 C623 318 646 318 670 341 C694 364 717 364 745 341"/>
    <path d="M466 356 C491 378 513 378 535 356 M665 356 C687 378 710 378 734 356" opacity=".55"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <text x="600" y="648" fill="#e8fbff" font-size="33" font-weight="650" letter-spacing="2">AQUA MNEMOSYNE</text>
    <text x="600" y="677" fill="#9fc8d7" font-size="14" letter-spacing="3">MEMORY · EVIDENCE · CARE</text>
  </g>
</svg>
